services:
  # ---------------------------------------------------------------------------
  # 0. Base de Datos (PostgreSQL 16)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: softcore_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-softcore_db}
      POSTGRES_USER: ${POSTGRES_USER:-softcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-softcore_secret}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-softcore} -d ${POSTGRES_DB:-softcore_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - softcore_internal

  # ---------------------------------------------------------------------------
  # 1. Aplicación Backend (PHP 8.4-FPM + Symfony)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: softcore_app
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_MAINTENANCE: ${APP_MAINTENANCE:-0}
      APP_SECRET: ${APP_SECRET:-b34f2a78e1c9d405060708090a0b0c0d}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-softcore}:${POSTGRES_PASSWORD:-softcore_secret}@db:5432/${POSTGRES_DB:-softcore_db}?serverVersion=16&charset=utf8}
      DEFAULT_URI: ${APP_DEFAULT_URI:-https://softcorec.com}
      TRUSTED_PROXIES: 127.0.0.1,REMOTE_ADDR,172.16.0.0/12,10.0.0.0/8
    volumes:
      - app_var:/var/www/html/var
      - ./public:/var/www/html/public
      - ./templates:/var/www/html/templates:ro
      - ./src:/var/www/html/src:ro
      - ./config:/var/www/html/config:ro
      - ./migrations:/var/www/html/migrations:ro
      - ./translations:/var/www/html/translations:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - softcore_internal

  # ---------------------------------------------------------------------------
  # 2. Servidor Web (Nginx para assets y FastCGI)
  # ---------------------------------------------------------------------------
  web:
    image: nginx:1.27-alpine
    container_name: softcore_web
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    ports:
      - "${PORT:-8090}:80"
    depends_on:
      - app
    networks:
      - softcore_internal

volumes:
  app_var:
    name: softcore_app_var
  db_data:
    name: softcore_db_data

networks:
  softcore_internal:
    name: softcore_internal_net
    driver: bridge
