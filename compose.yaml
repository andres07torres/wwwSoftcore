services:
  # ---------------------------------------------------------------------------
  # 1. Aplicación Backend (PHP 8.4-FPM + Symfony)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: softcore_app
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_MAINTENANCE: ${APP_MAINTENANCE:-0}
      APP_SECRET: ${APP_SECRET:-b34f2a78e1c9d405060708090a0b0c0d}
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:secret@127.0.0.1:5432/app?serverVersion=16&charset=utf8}
      DEFAULT_URI: ${APP_DEFAULT_URI:-https://softcore.andr3sdev7.com}
      TRUSTED_PROXIES: 127.0.0.1,REMOTE_ADDR,172.16.0.0/12,10.0.0.0/8
    volumes:
      - app_var:/var/www/html/var
      - ./public:/var/www/html/public
      - ./templates:/var/www/html/templates:ro
      - ./src:/var/www/html/src:ro
      - ./config:/var/www/html/config:ro
      - ./translations:/var/www/html/translations:ro
    networks:
      - softcore_internal

  # ---------------------------------------------------------------------------
  # 2. Servidor Web (Nginx para assets y FastCGI)
  # ---------------------------------------------------------------------------
  web:
    image: nginx:1.27-alpine
    container_name: softcore_web
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    ports:
      - "${PORT:-8090}:80"
    depends_on:
      - app
    networks:
      - softcore_internal

volumes:
  app_var:
    name: softcore_app_var

networks:
  softcore_internal:
    name: softcore_internal_net
    driver: bridge
