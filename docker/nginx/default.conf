server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # Logs dirigidos a stdout/stderr de Docker
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Compresión Gzip para entrega ultra-rápida de assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/ttf font/otf;

    # Cabeceras de seguridad HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Límites de subida
    client_max_body_size 20M;

    # Cache estático de larga duración para bundles compilados por Vite
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Cache para imágenes y favicons (servir directo desde public)
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    # Bloquear acceso a archivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Controlador frontal de Symfony
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Procesamiento PHP mediante PHP-FPM
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Notificar a PHP que el túnel de Cloudflare maneja HTTPS
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
        fastcgi_param SERVER_PORT 443;

        # Optimización de buffers FastCGI
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 60s;

        internal;
    }

    # Denegar ejecución directa de cualquier otro archivo PHP
    location ~ \.php$ {
        return 404;
    }
}
